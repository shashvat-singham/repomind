name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Retrieval eval — CI regression gate
        # Fails the build if hybrid retrieval regresses below the golden floor.
        run: npm run eval -- --ci

      - name: Production build
        run: npm run build
